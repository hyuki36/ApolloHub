name: ApolloHub review bot

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apollohub-bot-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch approved scripts from live site (3 passes)
        env:
          BOT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3; do
            echo "--- pass $i ---"
            if curl -sL --fail --max-time 30 -X POST "https://apollohub-nu.vercel.app/api/bot/export" \
              -H "Authorization: Bearer $BOT_TOKEN" \
              -o /tmp/apollo_export.json; then
              python3 -c "import json;json.load(open('/tmp/apollo_export.json'));print('export ok')" \
                && python3 bot/sync.py || echo "pass $i: sync skipped (bad export)"
            else
              echo "pass $i: fetch failed (deploy in progress?), retry next pass"
            fi
            if [ "$i" != "3" ]; then sleep 90; fi
          done
          echo "sweep done"

      - name: Commit if changed
        run: |
          git config user.name "apollohub-bot"
          git config user.email "apollohub-bot@users.noreply.github.com"
          git add scripts.json
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Bot: approve scripts"
          git push
